<text x="80" y="700" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#536174">* 规则回放使用本地测试夹具标签，不能当作行业泛化准确率。API 真实长文夹具 test Top-1=71.4%，错误关联率=4.1%。</text>
