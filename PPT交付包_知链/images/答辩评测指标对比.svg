<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720">
<rect width="1300" height="720" fill="#fbfcfe"/>
<text x="80" y="60" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#172033">模型评测：准确性与安全性的取舍</text>
<text x="80" y="94" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#536174">同一 seed/sanity 集，180 个决策点；本地模型当前配置为高拒答安全基线</text>
<line x1="125" y1="600" x2="1210" y2="600" stroke="#8793a3" stroke-width="2"/><line x1="125" y1="150" x2="125" y2="600" stroke="#8793a3" stroke-width="2"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#536174">
  <line x1="125" y1="487.5" x2="1210" y2="487.5" stroke="#e3e8ef"/><text x="115" y="492" text-anchor="end">25%</text>
  <line x1="125" y1="375" x2="1210" y2="375" stroke="#e3e8ef"/><text x="115" y="380" text-anchor="end">50%</text>
  <line x1="125" y1="262.5" x2="1210" y2="262.5" stroke="#e3e8ef"/><text x="115" y="267" text-anchor="end">75%</text>
  <text x="115" y="155" text-anchor="end">100%</text>
</g>
<g font-family="Microsoft YaHei, sans-serif">
  <rect x="245" y="330" width="100" height="270" fill="#3b73c5"/><text x="295" y="315" text-anchor="middle" font-size="19" fill="#172033">60%</text>
  <rect x="370" y="600" width="100" height="0" fill="#d86555"/><text x="420" y="628" text-anchor="middle" font-size="15" fill="#536174">错误33.3%</text>
  <text x="357" y="660" text-anchor="middle" font-size="20" fill="#172033">DeepSeek API</text>
  <rect x="650" y="420" width="100" height="180" fill="#8055bd"/><text x="700" y="405" text-anchor="middle" font-size="19" fill="#172033">40%</text>
