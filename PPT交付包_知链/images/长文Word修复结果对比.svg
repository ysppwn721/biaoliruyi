<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
<title>长文 Word 修复结果对比</title>
<desc>真实长文压力测试中，轻微和较大 Excel 变化分别修复80项和232项，修复后均回到280项一致。</desc>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="110" y="44" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="600" fill="#172033">长文 Word 测试：只修复失效论断</text>
<text x="110" y="70" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#536174">24章 · 约1.7万字 · 280项论断 · 修复后两种场景均全部一致</text>
<line x1="110" y1="510" x2="1050" y2="510" stroke="#8995a5"/>
<line x1="110" y1="510" x2="110" y2="95" stroke="#8995a5"/>
<line x1="110" y1="510.0" x2="1050" y2="510.0" stroke="#dfe5ed"/>
<text x="98" y="515.0" text-anchor="end" font-family="Arial" font-size="13" fill="#536174">0</text>
<line x1="110" y1="427.0" x2="1050" y2="427.0" stroke="#dfe5ed"/>
<text x="98" y="432.0" text-anchor="end" font-family="Arial" font-size="13" fill="#536174">56</text>
<line x1="110" y1="344.0" x2="1050" y2="344.0" stroke="#dfe5ed"/>
<text x="98" y="349.0" text-anchor="end" font-family="Arial" font-size="13" fill="#536174">112</text>
<line x1="110" y1="261.0" x2="1050" y2="261.0" stroke="#dfe5ed"/>
<text x="98" y="266.0" text-anchor="end" font-family="Arial" font-size="13" fill="#536174">168</text>
<line x1="110" y1="178.0" x2="1050" y2="178.0" stroke="#dfe5ed"/>
<text x="98" y="183.0" text-anchor="end" font-family="Arial" font-size="13" fill="#536174">224</text>
<line x1="110" y1="95.0" x2="1050" y2="95.0" stroke="#dfe5ed"/>
<text x="98" y="100.0" text-anchor="end" font-family="Arial" font-size="13" fill="#536174">280</text>
<rect x="183.0" y="391.4" width="150" height="118.6" fill="#d86555"/>
<text x="258.0" y="379.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">80</text>
<rect x="357.0" y="213.6" width="150" height="296.4" fill="#0b8a72"/>
<text x="432.0" y="201.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">200</text>
<text x="345.0" y="538" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#172033">销售额 125→123</text>
<rect x="653.0" y="166.1" width="150" height="343.9" fill="#d86555"/>
<text x="728.0" y="154.1" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">232</text>
<rect x="827.0" y="438.9" width="150" height="71.1" fill="#0b8a72"/>
<text x="902.0" y="426.9" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">48</text>
<text x="815.0" y="538" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#172033">销售额 125→90</text>
<text x="815.0" y="557" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#172033">A产品80→60</text>
<text x="815.0" y="576" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#172033">支出80→110</text>
<text x="580.0" y="572" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#172033">Excel 变化场景</text>
<text x="25" y="302.5" transform="rotate(-90 25 302.5)" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#172033">论断数量</text>
<rect x="790" y="38" width="16" height="16" fill="#d86555"/><text x="814" y="52" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#536174">需修复</text>
<rect x="895" y="38" width="16" height="16" fill="#0b8a72"/><text x="919" y="52" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#536174">仍成立</text>
<text x="110" y="555" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#536174">结论：数值变化不等于整篇重写；系统只改失效锚点，并在导出后重新读取验证。</text>
</svg>