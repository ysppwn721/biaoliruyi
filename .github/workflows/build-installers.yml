name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: windows-x64
          - os: macos-13
            archive: darwin-x86_64
          - os: macos-14
            archive: darwin-arm64
          - os: ubuntu-22.04
            archive: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - shell: bash
        run: bash packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Zhilian-0.2.1-${{ matrix.archive }}
          path: artifacts/*
