<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="#f7f9fc"/>
<text x="80" y="70" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#152238">知链：跨文档证据链智能体</text>
<text x="80" y="108" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#536174">确定性计算负责正确性，模型负责语义候选，人工确认负责最终裁决</text>
<g font-family="Microsoft YaHei, sans-serif">
  <rect x="80" y="190" width="210" height="105" rx="18" fill="#e7f0ff" stroke="#3b73c5" stroke-width="3"/>
  <text x="185" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#1b4f91">输入文件</text>
  <text x="185" y="267" text-anchor="middle" font-size="18" fill="#34495e">Excel · Word · PPT</text>
  <rect x="360" y="190" width="210" height="105" rx="18" fill="#e9f7ef" stroke="#2b9a65" stroke-width="3"/>
  <text x="465" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#207a50">解析与锚点</text>
  <text x="465" y="267" text-anchor="middle" font-size="18" fill="#34495e">事实表 · 论断 · 位置</text>
  <rect x="640" y="170" width="270" height="145" rx="18" fill="#fff4df" stroke="#d6912b" stroke-width="3"/>
  <text x="775" y="214" text-anchor="middle" font-size="24" font-weight="700" fill="#9b6715">智能体编排</text>
  <text x="775" y="251" text-anchor="middle" font-size="18" fill="#34495e">准备 → 关联 → 诊断</text>
  <text x="775" y="280" text-anchor="middle" font-size="18" fill="#34495e">询问 → 修复 → 复核</text>
  <rect x="980" y="190" width="210" height="105" rx="18" fill="#f1eaff" stroke="#8055bd" stroke-width="3"/>
  <text x="1085" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#633f9b">人工确认</text>
  <text x="1085" y="267" text-anchor="middle" font-size="18" fill="#34495e">来源与修复双闸门</text>
  <rect x="1260" y="190" width="170" height="105" rx="18" fill="#e8f7f5" stroke="#198d82" stroke-width="3"/>
  <text x="1345" y="232" text-anchor="middle" font-size="24" font-weight="700" fill="#166e67">成果包</text>
  <text x="1345" y="267" text-anchor="middle" font-size="18" fill="#34495e">新文件 · 报告</text>
  <g stroke="#718096" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="290" y1="242" x2="360" y2="242"/><line x1="570" y1="242" x2="640" y2="242"/><line x1="910" y1="242" x2="980" y2="242"/><line x1="1190" y1="242" x2="1260" y2="242"/>
  </g>
  <rect x="200" y="440" width="310" height="130" rx="18" fill="#ffffff" stroke="#3b73c5" stroke-width="3"/>
  <text x="355" y="480" text-anchor="middle" font-size="23" font-weight="700" fill="#1b4f91">确定性引擎</text>
  <text x="355" y="515" text-anchor="middle" font-size="17" fill="#34495e">Decimal计算 · 单位/口径</text>
  <text x="355" y="543" text-anchor="middle" font-size="17" fill="#34495e">增长率 · 阈值 · 排名 · 图表</text>
  <rect x="595" y="410" width="310" height="160" rx="18" fill="#ffffff" stroke="#d6912b" stroke-width="3"/>
  <text x="750" y="450" text-anchor="middle" font-size="23" font-weight="700" fill="#9b6715">模型工具（可选）</text>
  <text x="750" y="485" text-anchor="middle" font-size="17" fill="#34495e">DeepSeek API：语义关联</text>
  <text x="750" y="515" text-anchor="middle" font-size="17" fill="#34495e">本地 INT8 reranker：候选排序</text>
  <text x="750" y="545" text-anchor="middle" font-size="17" fill="#34495e">低置信度 → 人工/API</text>
  <rect x="990" y="440" width="310" height="130" rx="18" fill="#ffffff" stroke="#2b9a65" stroke-width="3"/>
  <text x="1145" y="480" text-anchor="middle" font-size="23" font-weight="700" fill="#207a50">审计与回滚</text>
  <text x="1145" y="515" text-anchor="middle" font-size="17" fill="#34495e">版本、SHA256、变更记录</text>
  <text x="1145" y="543" text-anchor="middle" font-size="17" fill="#34495e">修复后重读验证 · 可撤销</text>
  <g stroke="#9aa7b8" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)">
    <path d="M775 315 C775 350 750 370 750 410"/><path d="M640 500 C560 500 530 500 510 500"/><path d="M905 500 C940 500 960 500 990 500"/>
  </g>
</g>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#718096"/></marker></defs>
</svg>
